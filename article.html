<body>
<header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">PI</span><span><strong>Power Industry Journal</strong><small>Author review</small></span></a><a class="home-button" href="index.html#reviews">Home</a></header>

<script>
const data=window.SITE_DATA||{articles:[]};
const params=new URLSearchParams(location.search);
const article=data.articles.find((item)=>item.slug===params.get('slug'));
const detail=document.querySelector('#article-detail');
const esc=(value)=>String(value??'').replace(/[&<>"']/g,(ch)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));
const fmt=(date)=>new Intl.DateTimeFormat('en',{day:'2-digit',month:'short',year:'numeric'}).format(new Date(date));
const tags=(items=[])=>items.map((tag)=>`<span>${esc(tag)}</span>`).join('');
function normalizeFormula(value){let text=String(value??'').trim();text=text.replace(/\\mathrm\{([^{}]+)\}/g,'$1').replace(/\\operatorname\{([^{}]+)\}/g,'$1').replace(/\\dot\{m\}/g,'\u1E41').replace(/\\dot\{V\}/g,'V\u0307').replace(/\\dot\{([A-Za-z])\}/g,'$1\u0307').replace(/\\frac\{([^{}]+)\}\{([^{}]+)\}/g,'($1) / ($2)').replace(/\\sqrt\{([^{}]+)\}/g,'\u221A($1)').replace(/_\{([^{}]+)\}/g,'_$1').replace(/\\approx/g,'\u2248').replace(/\\times/g,'\u00D7').replace(/\\cdot/g,'\u00B7').replace(/\\Delta/g,'\u0394').replace(/\\rho/g,'\u03C1').replace(/\\omega/g,'\u03C9').replace(/\\phi/g,'\u03C6').replace(/\\pi/g,'\u03C0').replace(/\bapproximately\b/g,'\u2248').replace(/>=/g,'\u2265').replace(/<=/g,'\u2264').replace(/\s+x\s+/g,' \u00D7 ').replace(/\bsqrt\(([^()]+)\)/g,'\u221A($1)').replace(/\bintegral\(([^()]+)\)/g,'\u222B $1').replace(/\bomega\b/g,'\u03C9').replace(/\bphi\b/g,'\u03C6').replace(/\bpi\b/g,'\u03C0').replace(/\bDelta\s+/g,'\u0394').replace(/\u0394\s*T/g,'\u0394T').replace(/\u0394\s*t/g,'\u0394t');const replacements=[[/\bIref\b/g,'I_ref'],[/\bKp\b/g,'K_p'],[/\bKi\b/g,'K_i'],[/\beV\b/g,'e_V'],[/\bVout\b/g,'V_out'],[/\bVin\b/g,'V_in'],[/\bVref\b/g,'V_ref'],[/\bVbus\b/g,'V_bus'],[/\bVdc\b/g,'V_dc'],[/\bPout\b/g,'P_out'],[/\bTHDi\b/g,'THD_i'],[/\bCoss\b/g,'C_oss'],[/\bVds\b/g,'V_ds'],[/\bLr\b/g,'L_r'],[/\biL\b/g,'i_L'],[/\bdiL\b/g,'di_L'],[/\bvd\b/g,'v_d'],[/\bvq\b/g,'v_q'],[/\bid\b/g,'i_d'],[/\biq\b/g,'i_q'],[/\bv_alpha\b/g,'v_\u03B1'],[/\bi_alpha\b/g,'i_\u03B1'],[/\bv_beta\b/g,'v_\u03B2'],[/\bi_beta\b/g,'i_\u03B2'],[/\beta_total\b/g,'\u03B7_total'],[/\beta_PFC\b/g,'\u03B7_PFC'],[/\beta_isolated_DC_DC\b/g,'\u03B7_isolated_DC_DC'],[/\beta_intermediate_bus\b/g,'\u03B7_intermediate_bus'],[/\beta_point_of_load\b/g,'\u03B7_point_of_load'],[/\bphase_shift_command\b/g,'\u03C6_cmd'],[/\bphase_shift\b/g,'\u03C6'],[/\bDelta t\b/g,'\u0394t']];for(const [pattern,replacement] of replacements){text=text.replace(pattern,replacement);}return text;}
function splitFormulaLabel(text){const idx=text.indexOf(':');if(idx>0&&idx<48){return [text.slice(0,idx).trim(),text.slice(idx+1).trim()];}return ['',text];}
function formulaExpressionHtml(expression){return esc(expression).replace(/\^([A-Za-z0-9]+)/g,'<sup>$1</sup>').replace(/_([A-Za-z0-9\u03B1\u03B2\u03B3\u03B4\u03C1\u03C6]+)/g,'<sub>$1</sub>');}
function formulaHtml(raw){const normalized=normalizeFormula(raw);const [label,expression]=splitFormulaLabel(normalized);const labelHtml=label?`<span class="formula-label">${esc(label)}</span>`:'';return `<div class="formula">${labelHtml}<span class="formula-expression">${formulaExpressionHtml(expression)}</span></div>`;}
function sections(items=[]){return items.map((section)=>{const body=section.body?`<p>${esc(section.body)}</p>`:'';const paras=section.paragraphs?section.paragraphs.map((p)=>`<p>${esc(p)}</p>`).join(''):'';const formulae=section.formulae?section.formulae.map((f)=>formulaHtml(f)).join(''):'';const points=section.points?`<div class="review-points">${section.points.map((point)=>`<div class="review-point"><strong>${esc(point.label)}</strong><p>${esc(point.text)}</p></div>`).join('')}</div>`:'';return `<section class="review-section-block"><h4>${esc(section.heading)}</h4>${body}${formulae}${paras}${points}</section>`;}).join('');}
if(!article){detail.innerHTML='<div class="empty-state"><h1>Article not found</h1><p>The requested author review could not be found.</p><a class="home-button" href="index.html#reviews">Home</a></div>';}else{document.title=`${article.title} | Power Industry Journal`;detail.innerHTML=`<header class="article-hero"><p class="eyebrow">Author Review</p><h1>${esc(article.title)}</h1><div class="meta"><span>${article.articleNo?`Article No. ${esc(article.articleNo)}`:esc(article.topic)}</span><span>Updated ${esc(fmt(article.date))}</span><span>${esc(article.topic)}</span><span>${esc(article.readTime||'Read time reserved')}</span></div><p class="source-row"><span>Source:</span><a class="source-link" href="${esc(article.sourceUrl)}" target="_blank" rel="noreferrer">${esc(article.sourceTitle)}</a></p><div class="topic-art ${esc(article.imageTone||'')}"><span></span><span></span><span></span></div><p class="section-intro">${esc(article.excerpt)}</p><div class="tag-row">${tags(article.tags)}</div></header><div class="article-body">${sections(article.sections)}<div class="ceng-note"><strong>CEng angle</strong><p>${esc(article.cengAngle)}</p></div></div>`;}
</script>
